name: Tokyo Ghoul Craft

on:
  push:
    paths:
      - 'tokyoghoul/**'
      - '.github/workflows/tokyoghoul.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: tokyoghoul

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and package
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      - name: GameTests (every character's moveset, AI, factions, player selection)
        shell: bash
        run: |
          set -o pipefail
          timeout 1200 ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokyoghoul-jar
          path: tokyoghoul/build/libs/*.jar
          if-no-files-found: ignore

      - name: Error summary
        if: failure()
        shell: bash
        run: |
          grep -E "\.java:[0-9]+: error" -A 3 build.log | head -n 300 || true
          grep -iE "failed!|exception|caused by" gametest.log 2>/dev/null | head -n 100 || true

  showcase:
    # Launches the real client under a virtual display and photographs every character, kagune,
    # transformation, quinque and mask. Runs when the commit message contains [tg-showcase].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tg-showcase]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display
        working-directory: .
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1 libgl1-mesa-dri libglu1-mesa

      - name: Run client showcase
        shell: bash
        env:
          TG_SHOWCASE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p run/config
          printf 'onboardAccessibility:false\nrenderDistance:6\nsimulationDistance:6\nguiScale:2\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nsoundCategory_master:0.0\n' > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --console=plain < /dev/null > client.log 2>&1 || echo "client exited with $?"
          ls -la run/screenshots || true

      - name: Commit screenshots
        if: always()
        shell: bash
        run: |
          pip install -q pillow
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.jpg
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for f in sorted(glob.glob('run/screenshots/*.png')):
              im = Image.open(f).convert('RGB')
              im.thumbnail((1280, 720))
              im.save(os.path.join('docs/screenshots', os.path.splitext(os.path.basename(f))[0] + '.jpg'), 'JPEG', quality=86)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "no screenshots"; exit 0; fi
          git commit -m "Update Tokyo Ghoul showcase screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
